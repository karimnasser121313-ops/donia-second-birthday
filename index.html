<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#922b20">
<title>إلى دنيا نصي التاني ❤️</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#15151b;font-family:Tahoma,Arial,sans-serif}
.top{position:absolute;inset:0 0 auto;height:270px;background:#90271f;border-radius:0 0 48% 8%;z-index:0}
main{position:relative;z-index:1;width:min(100%,680px);margin:auto;padding:0 18px 40px}
.photo{display:block;width:100%;height:auto;aspect-ratio:591/726;object-fit:cover;border-radius:8px;margin:69px auto 52px;box-shadow:0 5px 18px #0002}
h1{text-align:center;font-size:clamp(25px,5vw,36px);line-height:1.55;margin:0 0 18px}
.message{font-size:clamp(19px,4vw,26px);line-height:1.85;text-align:center;color:#888;margin:0 0 40px}
.player{width:100%;border-radius:12px;background:#d6c7cc;padding:22px 20px;box-shadow:0 4px 12px #0002}
audio{display:block;width:100%;height:60px}
@media(min-width:700px){.photo{margin-top:80px}}
</style>
</head>
<body>
<div class="top" aria-hidden="true"></div>
<main>
<img class="photo" src="donia-photo.jpg" alt="صورة ظلال شخصين يصنعان قلبًا بأيديهما">
<h1>إلى دنيا نصي التاني ❤️</h1>
<p class="message">"يا رب تكون سنة خير وسعادة عليكي يا أجمل من رأت عيني. كل سنة وأنتي منورة حياتي بضحكتك اللي مفيش زيها. ❤️❤️❤️❤️"<br>مهما قلت من كلام مش هيوفي إحساسي بيكي..<br>ربنا يديمك ليا نعمة، وكل سنة وأنتي أقرب لقلبي ❤️❤️</p>
<div class="player">
<audio controls preload="metadata">
<source src="birthday-song.mp3" type="audio/mpeg">
متصفحك لا يدعم تشغيل الصوت.
</audio>
</div>
</main>
</body>
</html>
